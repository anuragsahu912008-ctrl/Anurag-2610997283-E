<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #ede9fe);
            margin: 0;
            padding: 40px 15px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 36px;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #475569;
            font-size: 16px;
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            margin: 0 auto;
            width: 90%;
            max-width: 900px;
            background-color: white;
            border: 3px solid #1e40af;
            border-collapse: separate;
            border-spacing: 5px;
            border-radius: 10px;
        }

        th {
            background-color: #1e40af;
            color: white;
            font-size: 17px;
            padding: 15px;
        }

        td {
            background-color: #eff6ff;
            color: #1e293b;
            padding: 13px;
            font-size: 15px;
            text-align: center;
        }

        tr:hover td {
            background-color: #dbeafe;
        }

        .footer {
            margin-top: 30px;
            padding: 15px 25px;
            text-align: right;
            color: #1e3a8a;
            font-size: 17px;
            font-weight: bold;
            border-top: 2px solid #c7d2fe;
        }

        .footer span {
            background-color: #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>

<body>

    <h1>Student Information</h1>
    <p class="subtitle">Academic Records of Students</p>

    <table border="2" cellpadding="10" cellspacing="5">
        <tr>
            <th>Roll Number</th>
            <th>Name</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Marks</th>
        </tr>

        </tr>

        <tr>
            <td>103</td>

            <td>85</td>
        </tr>

        <tr>
            <td>104</td>

    </table>

    <div class="footer">
        <span>Made by- <u><b><i>Anurag Sahu</i></b></u></span>
    </div>

</body>
</html>
